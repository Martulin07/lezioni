<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lezioni AI</title>
<meta name="description" content="Registra le lezioni, trascrivile e ottieni riassunti con approfondimenti da fonti scientifiche.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lezioni">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1c1c1e; --muted:#6e6e73; --line:#e5e3de;
  --accent:#2f5bd3; --accent-soft:#e8eefc; --rec:#e0312f; --ok:#1f8a4c; --warn:#9a5b00; --warn-bg:#fff4e0;
  --web:#0b6b63; --web-bg:#e3f3f0;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111214; --card:#1c1d20; --ink:#f2f2f4; --muted:#9b9ba3; --line:#2d2e33;
    --accent:#86a0ff; --accent-soft:#1f2740; --rec:#ff5a52; --ok:#4cc480; --warn:#f0b35a; --warn-bg:#2e2412;
    --web:#7fdcd1; --web-bg:#12302c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111214; --card:#1c1d20; --ink:#f2f2f4; --muted:#9b9ba3; --line:#2d2e33;
  --accent:#86a0ff; --accent-soft:#1f2740; --rec:#ff5a52; --ok:#4cc480; --warn:#f0b35a; --warn-bg:#2e2412;
  --web:#7fdcd1; --web-bg:#12302c; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
header.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);
  padding:max(10px,env(safe-area-inset-top)) 8px 10px}
.hwrap{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:40px}
.hwrap h1{flex:1;margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;color:var(--accent)}
.icon-btn:active{background:var(--accent-soft)}
.icon-btn svg{width:24px;height:24px}
main{max-width:720px;margin:0 auto;padding:16px 16px calc(130px + env(safe-area-inset-bottom))}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font-weight:600;font-size:16px;line-height:1.2;
  background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.rec{background:var(--rec)}
.btn.block{width:100%}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.danger-t{color:var(--rec)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;gap:10px;justify-content:center;
  padding:24px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 40%)}
.dock .btn{flex:1;max-width:340px;padding:16px;font-size:17px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;
  color:inherit;text-decoration:none}
.card:active{background:var(--accent-soft)}
.card .t{font-weight:600;font-size:17px;margin-bottom:2px;overflow-wrap:anywhere}
.card .m{color:var(--muted);font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.busy{background:var(--accent-soft);color:var(--accent)}
.pill.err{background:color-mix(in srgb,var(--rec) 15%,transparent);color:var(--rec)}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.empty .big{font-size:48px;margin-bottom:8px}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:15px}
.note.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.note.err{background:color-mix(in srgb,var(--rec) 12%,transparent);border-color:transparent;color:var(--rec)}
.muted{color:var(--muted)}
.small-t{font-size:14px}
input[type=text],input[type=password],input:not([type]){width:100%;font-size:16px;padding:12px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none}
input:focus{border-color:var(--accent)}
.title-in{font-size:20px !important;font-weight:700;border-color:transparent !important;background:transparent !important;padding:4px 0 !important}
.title-in:focus{border-bottom:2px solid var(--accent) !important;border-radius:0 !important}
.meta{color:var(--muted);font-size:14px;margin-bottom:12px}
audio{width:100%;margin:4px 0 8px}
label.f{display:block;font-weight:600;margin:14px 0 6px}
h2.sec{font-size:17px;margin:28px 0 8px}
/* recording */
.recv{text-align:center;padding-top:12px}
.recbadge{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--rec);letter-spacing:.08em}
.recbadge i{width:12px;height:12px;border-radius:50%;background:var(--rec);animation:blink 1.2s infinite}
.recbadge.paused{color:var(--muted)} .recbadge.paused i{background:var(--muted);animation:none}
@keyframes blink{50%{opacity:.25}}
.timer{font:700 64px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;margin:20px 0}
.meter{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:0 auto 24px;max-width:360px}
.meter>div{height:100%;width:0;background:var(--ok);transition:width .08s linear}
.recv .row{justify-content:center}
.recv .row .btn{min-width:140px;padding:16px}
/* progress */
.prog{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.prog .lbl{font-weight:600;margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>div{height:100%;background:var(--accent);transition:width .3s}
.bar.ind>div{width:35%;animation:ind 1.3s ease-in-out infinite}
@keyframes ind{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.preview{margin-top:10px;font-size:13px;color:var(--muted);max-height:6.5em;overflow:hidden;
  -webkit-mask-image:linear-gradient(transparent,#000 40%);mask-image:linear-gradient(transparent,#000 40%)}
/* tabs */
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;margin:16px 0 8px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* document */
.doc{font-size:16.5px;line-height:1.6;overflow-wrap:anywhere}
.doc h1{font-size:22px;line-height:1.25;margin:18px 0 10px}
.doc h2{font-size:18px;margin:26px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.doc h3,.doc h4{font-size:16.5px;margin:18px 0 6px}
.doc ul,.doc ol{padding-left:22px;margin:8px 0}
.doc li{margin:6px 0}
.doc p{margin:10px 0}
.doc code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:var(--line);padding:1px 4px;border-radius:4px}
.doc .ts{font:600 12px ui-monospace,Menlo,monospace;color:var(--accent);background:var(--accent-soft);padding:1px 5px;border-radius:5px;margin-right:6px;font-style:normal}
/* AI / web additions: different typeface */
.web{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;font-style:italic;
  color:var(--web);background:var(--web-bg);border-radius:4px;padding:0 3px;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
.web strong{font-weight:700}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13.5px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;margin:8px 0 4px}
.sources{font-size:14px}
.sources li{margin:4px 0}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px);
  box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<header class="top"><div class="hwrap">
  <button class="icon-btn" id="hLeft" aria-label="Indietro"></button>
  <h1 id="hTitle">Lezioni</h1>

</div></header>
<main id="main"></main>

<input type="file" id="fileIn" accept="audio/*,.m4a,.mp3,.wav,.aac,.ogg,.flac,.mp4,.webm" hidden>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ================= utilities ================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const words = t => (t.match(/\S+/g) || []).length;
const fmtDur = s => {
  if (!s || !isFinite(s)) return '—';
  s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}` : `${m}:${String(x).padStart(2,'0')}`;
};
const fmtSize = b => b ? (b / 1048576).toFixed(1).replace('.', ',') + ' MB' : '';
const fmtDate = ts => new Date(ts).toLocaleString('it-IT', {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
const ICON = {
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
};
let toastT;
function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms);
}
function lsGet(k, d = '') { try { return localStorage.getItem(k) ?? d; } catch { return d; } }
function lsSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }

/* ================= settings ================= */
const DEFAULT_MODEL = 'gemini-flash-latest';
const S = {
  get key() { return lsGet('gk_key'); },
  set key(v) { lsSet('gk_key', v.trim()); },
  get mTr() { return lsGet('gk_model_tr') || DEFAULT_MODEL; },
  set mTr(v) { lsSet('gk_model_tr', v.trim().replace(/^models\//, '') || null); },
  get mSum() { return lsGet('gk_model_sum') || DEFAULT_MODEL; },
  set mSum(v) { lsSet('gk_model_sum', v.trim().replace(/^models\//, '') || null); },
};

/* ================= IndexedDB ================= */
let _db;
function db() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const r = indexedDB.open('lezioni-db', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('lectures', {keyPath: 'id'});
      d.createObjectStore('audio', {keyPath: 'id'});
      d.createObjectStore('chunks', {keyPath: ['recId', 'seq']}).createIndex('recId', 'recId');
    };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
async function op(store, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction(store, mode);
    const r = fn(tx.objectStore(store));
    tx.oncomplete = () => res(r ? r.result : undefined);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error('Transazione annullata'));
  });
}
const DB = {
  get: (s, k) => op(s, 'readonly', st => st.get(k)),
  put: (s, v) => op(s, 'readwrite', st => st.put(v)),
  del: (s, k) => op(s, 'readwrite', st => st.delete(k)),
  all: s => op(s, 'readonly', st => st.getAll()),
};
async function patchLecture(id, patch) {
  const L = await DB.get('lectures', id); if (!L) return null;
  Object.assign(L, patch); await DB.put('lectures', L); return L;
}

/* ================= markdown + <web> rendering ================= */
const WO = '\u0001', WC = '\u0002';
function inline(s) {
  s = esc(s);
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
       .replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\w)/g, '$1<em>$2</em>')
       .replace(/`([^`]+)`/g, '<code>$1</code>')
       .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
       .replace(/^([\u0001\u0002]*)\[(\d{1,2}:\d{2}(?::\d{2})?)\]\s*/, '$1<span class="ts">$2</span>');
  return s;
}
function renderMd(md) {
  md = String(md || '').replace(/\r/g, '').replace(/<\s*web\s*>/gi, WO).replace(/<\s*\/\s*web\s*>/gi, WC);
  let out = '', list = null, para = [], st = false;
  const closePara = () => { if (para.length) { out += '<p>' + para.join('<br>') + '</p>'; para = []; } };
  const closeList = () => { if (list) { out += `</${list}>`; list = null; } };
  // turn the marker chars into balanced spans for one line; web state carries across lines
  const spans = html => {
    let o = st ? '<span class="web">' : '';
    for (const ch of html) {
      if (ch === WO) { if (!st) { o += '<span class="web">'; st = true; } }
      else if (ch === WC) { if (st) { o += '</span>'; st = false; } }
      else o += ch;
    }
    return st ? o + '</span>' : o;
  };
  for (const raw of md.split('\n')) {
    const m = raw.match(/^([\s\u0001\u0002]*)(.*)$/);
    const lead = m[1].replace(/\s/g, ''), rest = m[2];
    if (!rest.trim()) { if (lead) spans(lead); else { closePara(); closeList(); } continue; }
    let h;
    if ((h = rest.match(/^(#{1,6})\s+(.*)$/))) {
      closePara(); closeList();
      const n = Math.min(h[1].length, 4);
      out += `<h${n}>${spans(inline(lead + h[2].replace(/\s#+\s*$/, '')))}</h${n}>`;
    } else if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(rest)) {
      closePara(); closeList(); if (lead) spans(lead); out += '<hr>';
    } else if ((h = rest.match(/^[-*•+]\s+(.*)$/)) || (h = rest.match(/^\d+[.)]\s+(.*)$/))) {
      const kind = /^\d/.test(rest) ? 'ol' : 'ul';
      closePara(); if (list !== kind) { closeList(); out += `<${kind}>`; list = kind; }
      out += `<li>${spans(inline(lead + h[1]))}</li>`;
    } else {
      closeList(); para.push(spans(inline(lead + rest)));
    }
  }
  closePara(); closeList();
  return out;
}
const plainText = md => String(md || '').replace(/<\s*web\s*>/gi, '[🔎 ').replace(/<\s*\/\s*web\s*>/gi, ']');

/* ================= Gemini API ================= */
const API = 'https://generativelanguage.googleapis.com';
const TR_PROMPT = `Trascrivi integralmente questa registrazione di una lezione universitaria.
Regole:
- Trascrivi tutto ciò che viene detto, dall'inizio alla fine, senza riassumere, tagliare o aggiungere nulla.
- Usa la lingua in cui si parla (di norma l'italiano).
- Togli solo le esitazioni (ehm, ehh) e le false partenze; mantieni le parole del docente.
- Dividi il testo in paragrafi leggibili, uno a ogni cambio di argomento o circa ogni 1–3 minuti.
- Inizia ogni paragrafo con il riferimento temporale tra parentesi quadre, ad esempio [00:00], [12:35] o [1:05:20].
- Se interviene uno studente, scrivi "Studente:" all'inizio del suo intervento; per il docente non serve indicarlo.
- Scrivi correttamente termini tecnici, nomi propri, sigle e formule (in forma leggibile, es. E = mc^2).
- Se un passaggio è incomprensibile scrivi [incomprensibile]; ignora rumori e lunghi silenzi.
Rispondi solo con la trascrizione, senza introduzioni né commenti.`;

const SUM_SYS = `Sei un tutor universitario esperto. Ricevi la trascrizione di una lezione e prepari materiale di studio in italiano, in formato Markdown, con esattamente questa struttura:

# (titolo che descrive l'argomento della lezione)

## Riassunto
Un riassunto chiaro e ordinato della lezione (indicativamente 300–700 parole, in paragrafi), che segue il filo logico del docente.

## Punti salienti
Elenco puntato degli 8–15 concetti più importanti: definizioni, teorie, meccanismi, formule, date, autori, esempi citati dal docente. Usa il **grassetto** per i termini chiave.

## Glossario
Elenco puntato dei termini tecnici usati nella lezione, nel formato "**termine**: spiegazione breve".

## Approfondimenti dal web
Usa la ricerca Google per trovare informazioni che integrano e approfondiscono gli argomenti principali della lezione: definizioni ufficiali, dati aggiornati, studi recenti, contesto storico, collegamenti con altri argomenti.
Usa SOLO fonti scientifiche o accademiche affidabili: articoli su riviste peer-reviewed, PubMed/NCBI, Google Scholar, siti di università ed enti di ricerca, enciclopedie accademiche (Treccani, Britannica, Stanford Encyclopedia of Philosophy), organismi ufficiali (OMS, ISS, ISTAT, ecc.), manuali universitari. Evita blog, forum, siti commerciali, siti divulgativi non verificati e Wikipedia come fonte principale.
Scrivi 4–8 punti; alla fine di ciascuno indica la fonte tra parentesi, ad esempio (Fonte: Nature, 2023).

## Domande per il ripasso
5–8 domande del tipo che potrebbero essere fatte all'esame, basate sulla lezione.

REGOLA FONDAMENTALE SULLA PROVENIENZA DELLE INFORMAZIONI:
- Ciò che deriva dalla lezione va scritto normalmente, senza tag.
- Ogni informazione che NON è stata detta nella lezione (presa dal web o dalle tue conoscenze) va racchiusa tra i tag <web> e </web>, ovunque si trovi, anche quando aggiungi una precisazione dentro il riassunto, i punti salienti o il glossario.
- Nella sezione "Approfondimenti dal web" racchiudi il testo di ogni punto in <web>…</web>, aprendo e chiudendo il tag sulla stessa riga (il trattino dell'elenco resta fuori dal tag).
- Se nella lezione c'è un'affermazione imprecisa o superata, segnalalo con garbo dentro <web>…</web> citando la fonte.
- Non inventare mai fonti, dati o citazioni. Se per un punto non trovi fonti affidabili, non includerlo.
Non scrivere nulla prima del titolo né dopo l'ultima sezione.`;

function apiMsg(status, body) {
  let msg = '';
  try { const j = typeof body === 'string' ? JSON.parse(body) : body; msg = j?.error?.message || ''; } catch { msg = String(body || '').slice(0, 200); }
  if (/API_KEY_INVALID|API key not valid/i.test(msg)) return 'La chiave API non è valida. Controllala nelle Impostazioni.';
  if (status === 429) return 'Limite di utilizzo gratuito raggiunto. Riprova tra qualche minuto (o domani se è il limite giornaliero).';
  if (status === 403) return 'Chiave API non autorizzata (' + msg + ').';
  if (status === 404) return 'Modello non trovato: controlla il nome del modello nelle Impostazioni. (' + msg + ')';
  if (status >= 500) return 'Il servizio Google è momentaneamente sovraccarico. Riprova tra poco.';
  return `Errore ${status}: ${msg || 'richiesta non riuscita'}`;
}
async function apiError(r) { const e = new Error(apiMsg(r.status, await r.text())); e.status = r.status; return e; }
const keyHeaders = () => ({'x-goog-api-key': S.key});

function xhrPost(url, blob, headers, onProg) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('POST', url);
    for (const k in headers) x.setRequestHeader(k, headers[k]);
    x.upload.onprogress = e => { if (e.lengthComputable) onProg(Math.round(e.loaded / e.total * 100)); };
    x.onload = () => {
      if (x.status >= 200 && x.status < 300) { try { res(JSON.parse(x.responseText)); } catch (e) { rej(e); } }
      else { const e = new Error(apiMsg(x.status, x.responseText)); e.status = x.status; rej(e); }
    };
    x.onerror = () => rej(new Error('Errore di rete durante il caricamento dell\'audio. Controlla la connessione.'));
    x.send(blob);
  });
}
const blobToB64 = blob => new Promise((res, rej) => {
  const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = () => rej(fr.error); fr.readAsDataURL(blob);
});

// Uploads audio to the Gemini Files API; returns a content part plus the remote file name (for cleanup).
async function uploadAudio(blob, mime, name, onProg) {
  const start = await fetch(`${API}/upload/v1beta/files`, {
    method: 'POST',
    headers: {...keyHeaders(), 'X-Goog-Upload-Protocol': 'resumable', 'X-Goog-Upload-Command': 'start',
      'X-Goog-Upload-Header-Content-Length': String(blob.size), 'X-Goog-Upload-Header-Content-Type': mime,
      'Content-Type': 'application/json'},
    body: JSON.stringify({file: {display_name: name.slice(0, 100)}}),
  });
  if (!start.ok) throw await apiError(start);
  const url = start.headers.get('x-goog-upload-url');
  if (!url) {
    // Fallback for small files if the upload URL header is not readable
    if (blob.size > 15 * 1048576) throw new Error('Caricamento non riuscito (URL di upload mancante).');
    return {part: {inlineData: {mimeType: mime, data: await blobToB64(blob)}}, name: null};
  }
  let {file} = await xhrPost(url, blob, {'X-Goog-Upload-Offset': '0', 'X-Goog-Upload-Command': 'upload, finalize'}, onProg);
  for (let i = 0; file.state === 'PROCESSING' && i < 200; i++) {
    await sleep(3000);
    const r = await fetch(`${API}/v1beta/${file.name}`, {headers: keyHeaders()});
    if (!r.ok) throw await apiError(r);
    file = await r.json();
  }
  if (file.state === 'FAILED') throw new Error('Google non è riuscito a elaborare il file audio.');
  return {part: {fileData: {mimeType: file.mimeType || mime, fileUri: file.uri}}, name: file.name};
}
function deleteRemote(name) {
  if (name) fetch(`${API}/v1beta/${name}`, {method: 'DELETE', headers: keyHeaders()}).catch(() => {});
}

async function streamGenerate(model, body, onText) {
  const r = await fetch(`${API}/v1beta/models/${encodeURIComponent(model)}:streamGenerateContent?alt=sse`, {
    method: 'POST', headers: {...keyHeaders(), 'Content-Type': 'application/json'}, body: JSON.stringify(body),
  });
  if (!r.ok) throw await apiError(r);
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = '', text = '', finish = null; const sources = new Map(); const queries = new Set();
  const handle = line => {
    if (!line.startsWith('data:')) return;
    const j = JSON.parse(line.slice(5));
    if (j.error) throw new Error(apiMsg(j.error.code || 500, j));
    if (j.promptFeedback?.blockReason) throw new Error('Richiesta bloccata dai filtri di Google (' + j.promptFeedback.blockReason + ').');
    const c = j.candidates?.[0]; if (!c) return;
    for (const p of c.content?.parts || []) if (p.text && !p.thought) { text += p.text; onText?.(text); }
    if (c.finishReason) finish = c.finishReason;
    const g = c.groundingMetadata;
    if (g) {
      for (const ch of g.groundingChunks || []) if (ch.web?.uri) sources.set(ch.web.uri, ch.web.title || ch.web.uri);
      for (const q of g.webSearchQueries || []) queries.add(q);
    }
  };
  for (;;) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true});
    let i; while ((i = buf.indexOf('\n')) >= 0) { const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1); handle(line); }
  }
  if (buf.trim()) handle(buf.trim());
  if (!text.trim()) throw new Error(finish === 'SAFETY' || finish === 'RECITATION'
    ? `Google ha bloccato la risposta (${finish}).` : 'Nessun testo ricevuto dal modello.');
  return {text: text.trim(), finish, sources: [...sources].map(([uri, title]) => ({uri, title})), queries: [...queries]};
}

function audioMime(blob, fileName) {
  const t = (blob.type || '').toLowerCase().split(';')[0];
  const ext = (fileName || '').toLowerCase().split('.').pop();
  if (/mp4|m4a|aac/.test(t) && t !== 'audio/aac' || ext === 'm4a' || ext === 'mp4') return 'audio/mp4';
  if (t === 'audio/aac' || ext === 'aac') return 'audio/aac';
  if (/mpeg|mp3/.test(t) || ext === 'mp3') return 'audio/mp3';
  if (/wav/.test(t) || ext === 'wav') return 'audio/wav';
  if (/ogg/.test(t) || ext === 'ogg' || ext === 'oga') return 'audio/ogg';
  if (/flac/.test(t) || ext === 'flac') return 'audio/flac';
  if (/webm/.test(t) || ext === 'webm') return 'audio/webm';
  return t || 'audio/mp4';
}
// If Gemini rejects an audio container type, the same bytes are accepted as video
const MIME_FALLBACK = {'audio/mp4': 'video/mp4', 'audio/webm': 'video/webm'};

async function transcribe(blob, L, prog) {
  let mime = audioMime(blob, L.fileName);
  for (let attempt = 0; ; attempt++) {
    prog({stage: 'upload', pct: 0});
    const up = await uploadAudio(blob, mime, L.title || 'lezione', pct => prog({stage: 'upload', pct}));
    try {
      prog({stage: 'transcribe', words: 0});
      return await streamGenerate(S.mTr, {
        contents: [{role: 'user', parts: [up.part, {text: TR_PROMPT}]}],
        generationConfig: {maxOutputTokens: 65536},
      }, t => prog({stage: 'transcribe', words: words(t), preview: t.slice(-400)}));
    } catch (e) {
      if (attempt === 0 && e.status === 400 && MIME_FALLBACK[mime] && /mime|format|support/i.test(e.message)) { mime = MIME_FALLBACK[mime]; continue; }
      throw e;
    } finally { deleteRemote(up.name); }
  }
}
function summarize(L, prog) {
  return streamGenerate(S.mSum, {
    systemInstruction: {parts: [{text: SUM_SYS}]},
    contents: [{role: 'user', parts: [{text: `Titolo assegnato alla lezione: ${L.title}\n\nTRASCRIZIONE DELLA LEZIONE:\n\n${L.transcript}`}]}],
    tools: [{googleSearch: {}}],
    generationConfig: {maxOutputTokens: 32768},
  }, t => prog({stage: 'summary', words: words(t), preview: t.slice(-400)}));
}

/* ================= processing jobs ================= */
const JOBS = {};
function setJob(id, patch) {
  JOBS[id] = {...(JOBS[id] || {}), ...patch};
  if (cur.view === 'lecture' && cur.id === id) renderProc();
}
async function processLecture(id, {retranscribe = false} = {}) {
  if (JOBS[id]) return;
  if (!S.key) { toast('Prima inserisci la chiave API di Gemini'); go('#/settings'); return; }
  setJob(id, {stage: 'start'});
  const wl = await wakeLock();
  try {
    let L = await DB.get('lectures', id);
    if (retranscribe || !L.transcript) {
      const a = await DB.get('audio', id);
      if (!a) throw new Error('Audio non trovato.');
      const tr = await transcribe(a.blob, L, p => setJob(id, p));
      L = await patchLecture(id, {transcript: tr.text, truncated: tr.finish === 'MAX_TOKENS', summary: null, sources: null, status: 'trascritta', error: null});
    }
    setJob(id, {stage: 'summary', words: 0, preview: ''});
    const sm = await summarize(L, p => setJob(id, p));
    await patchLecture(id, {summary: sm.text, sources: sm.sources, queries: sm.queries, status: 'pronta', error: null, summarizedAt: Date.now()});
    toast('Riassunto pronto ✓');
  } catch (e) {
    console.error(e);
    await patchLecture(id, {error: e.message || String(e)});
  } finally {
    delete JOBS[id];
    try { await wl?.release(); } catch {}
    if (cur.view === 'lecture' && cur.id === id) route();
  }
}

/* ================= recording ================= */
let R = null;
async function wakeLock() { try { return await navigator.wakeLock?.request('screen'); } catch { return null; } }
const elapsed = r => r.acc + (r.rec.state === 'recording' ? Date.now() - r.segStart : 0);
function saveActive() { if (R) lsSet('activeRec', JSON.stringify({recId: R.recId, mime: R.mime, startedAt: R.startedAt, title: R.title})); }

async function startRecording() {
  if (!window.MediaRecorder || !navigator.mediaDevices?.getUserMedia) {
    alert('Questo browser non supporta la registrazione. Aggiorna iOS oppure registra con "Memo Vocali" e usa "Importa audio".'); return;
  }
  let ac = null; // created synchronously inside the tap so iOS allows it
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch {}
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: false, noiseSuppression: true, autoGainControl: true}});
  } catch (e) {
    ac?.close();
    alert('Non riesco ad accedere al microfono. Consenti l\'accesso quando richiesto (Impostazioni iPhone › Safari › Microfono › Consenti).'); return;
  }
  navigator.storage?.persist?.().catch(() => {});
  const mime = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'].find(m => MediaRecorder.isTypeSupported?.(m)) || '';
  const rec = new MediaRecorder(stream, mime ? {mimeType: mime, audioBitsPerSecond: 64000} : undefined);
  const st = R = {rec, stream, ac, recId: uid(), mime: rec.mimeType || mime || 'audio/mp4', startedAt: Date.now(),
    acc: 0, segStart: Date.now(), seq: 0, chain: Promise.resolve(), warnings: [], title: '', hiddenAt: 0};
  saveActive();
  rec.ondataavailable = e => {
    if (!e.data || !e.data.size) return;
    const seq = st.seq++, blob = e.data, recId = st.recId;
    st.chain = st.chain.then(() => op('chunks', 'readwrite', s => s.put({recId, seq, blob}))).catch(err => {
      console.error(err); st.warnings.push('Errore nel salvataggio di una parte dell\'audio.');
    });
  };
  stream.getAudioTracks()[0]?.addEventListener('ended', () => {
    if (R === st) { st.warnings.push('Il microfono è stato interrotto (es. chiamata in arrivo o altra app).'); stopRecording(); }
  });
  rec.start(10000); // a chunk every 10 s is saved immediately: nothing is lost if the app closes
  st.wake = await wakeLock();
  if (ac) {
    try {
      await ac.resume();
      const an = ac.createAnalyser(); an.fftSize = 512; ac.createMediaStreamSource(stream).connect(an);
      const buf = new Uint8Array(an.fftSize);
      const loop = () => {
        if (R !== st) return;
        an.getByteTimeDomainData(buf); let p = 0; for (const v of buf) p = Math.max(p, Math.abs(v - 128) / 128);
        const el = $('#lvl'); if (el) el.style.width = Math.min(100, p * 160) + '%';
        st.raf = requestAnimationFrame(loop);
      };
      loop();
    } catch {}
  }
  st.timer = setInterval(() => { const t = $('#timer'); if (t && R === st) t.textContent = fmtDur(elapsed(st) / 1000).padStart(5, '0'); }, 500);
  go('#/rec');
}
function togglePause() {
  const r = R; if (!r) return;
  if (r.rec.state === 'recording') { r.acc += Date.now() - r.segStart; r.rec.pause(); }
  else if (r.rec.state === 'paused') { r.segStart = Date.now(); r.rec.resume(); }
  renderRecState();
}
async function stopRecording() {
  const r = R; if (!r || r.stopping) return; r.stopping = true;
  const b = $('#stopBtn'); if (b) { b.disabled = true; b.textContent = 'Salvataggio…'; }
  const dur = elapsed(r) / 1000;
  if (r.rec.state !== 'inactive') {
    const stopped = new Promise(res => r.rec.addEventListener('stop', res, {once: true}));
    r.rec.stop(); await stopped;
  }
  await r.chain;
  clearInterval(r.timer); cancelAnimationFrame(r.raf);
  r.stream.getTracks().forEach(t => t.stop()); r.ac?.close().catch(() => {});
  try { await r.wake?.release(); } catch {}
  R = null;
  const id = await assemble(r.recId, {title: r.title, mime: r.mime, startedAt: r.startedAt, duration: dur, warnings: r.warnings.join(' ')});
  if (id) { toast('Registrazione salvata ✓'); go('#/l/' + id, true); } else { toast('Nessun audio registrato'); go('#/', true); }
}
async function assemble(recId, meta) {
  const chunks = await op('chunks', 'readonly', s => s.index('recId').getAll(recId));
  if (!chunks.length) { lsSet('activeRec', null); return null; }
  const blob = new Blob(chunks.map(c => c.blob), {type: (meta.mime || chunks[0].blob.type || 'audio/mp4').split(';')[0]});
  await DB.put('audio', {id: recId, blob});
  await DB.put('lectures', {id: recId, title: meta.title || 'Lezione del ' + new Date(meta.startedAt).toLocaleDateString('it-IT', {day: 'numeric', month: 'long'}),
    createdAt: meta.startedAt, duration: meta.duration ?? null, size: blob.size, source: 'rec', status: 'nuova', warnings: meta.warnings || null});
  await op('chunks', 'readwrite', s => s.delete(IDBKeyRange.bound([recId, -Infinity], [recId, Infinity])));
  lsSet('activeRec', null);
  return recId;
}
// Recover recordings whose app was closed/killed before "Termina"
async function recoverOrphans() {
  const keys = await op('chunks', 'readonly', s => s.getAllKeys());
  const ids = [...new Set(keys.map(k => k[0]))];
  let meta = null; try { meta = JSON.parse(lsGet('activeRec', 'null')); } catch {}
  for (const id of ids) {
    const m = meta && meta.recId === id ? meta : {};
    await assemble(id, {title: m.title || 'Registrazione recuperata', mime: m.mime, startedAt: m.startedAt || Date.now(),
      duration: null, warnings: 'Registrazione recuperata: l\'app era stata chiusa durante la registrazione.'});
  }
  if (ids.length) toast('Recuperata una registrazione interrotta');
}
document.addEventListener('visibilitychange', async () => {
  const r = R; if (!r) return;
  if (document.hidden) { r.hiddenAt = Date.now(); return; }
  if (r.hiddenAt) {
    const s = Math.round((Date.now() - r.hiddenAt) / 1000); r.hiddenAt = 0;
    if (s >= 3) {
      r.warnings.push(`L'app è rimasta in background per circa ${fmtDur(s)}: in quel tratto l'audio potrebbe mancare.`);
      const w = $('#recWarn'); if (w) w.innerHTML = `<div class="note warn">⚠️ ${esc(r.warnings.at(-1))}</div>`;
    }
  }
  if (!r.wake || r.wake.released) r.wake = await wakeLock();
});

function getDuration(blob) {
  return new Promise(res => {
    const a = new Audio(), u = URL.createObjectURL(blob);
    const done = v => { URL.revokeObjectURL(u); res(v); };
    a.preload = 'metadata';
    a.onloadedmetadata = () => done(isFinite(a.duration) ? a.duration : null);
    a.onerror = () => done(null);
    setTimeout(() => done(null), 6000);
    a.src = u;
  });
}
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const id = uid();
  toast('Importazione in corso…');
  try {
    await DB.put('audio', {id, blob: f});
    await DB.put('lectures', {id, title: f.name.replace(/\.[^.]+$/, ''), fileName: f.name, createdAt: f.lastModified || Date.now(),
      duration: await getDuration(f), size: f.size, source: 'import', status: 'nuova'});
    navigator.storage?.persist?.().catch(() => {});
    go('#/l/' + id);
  } catch (err) { alert('Importazione non riuscita: ' + err.message); }
});

  $('#delBtn').onclick = async () => {
    if (JOBS[id]) return toast('Attendi la fine dell\'elaborazione');
    if (!confirm('Eliminare definitivamente questa lezione, con audio, trascrizione e riassunto?')) return;
    await DB.del('audio', id); await DB.del('lectures', id); toast('Lezione eliminata'); go('#/', true);
  };
  $('#audBtn')?.addEventListener('click', () => shareFile(a.blob, safeName(L.title) + '.' + extFor(a.blob), L.title));
  renderProc(L);
  renderContent(L);
}
async function renderProc(L) {
  const box = $('#proc'); if (!box) return;
  const id = cur.id, j = JOBS[id];
  if (j) {
    const label = j.stage === 'upload' ? `Caricamento audio… ${j.pct || 0}%`
      : j.stage === 'transcribe' ? `Trascrizione in corso… ${j.words ? j.words.toLocaleString('it-IT') + ' parole' : 'ascolto la registrazione'}`
      : j.stage === 'summary' ? `Riassunto e ricerca di fonti scientifiche… ${j.words ? j.words.toLocaleString('it-IT') + ' parole' : ''}`
      : 'Avvio…';
    const det = j.stage === 'upload';
    box.innerHTML = `<div class="prog"><div class="lbl">${label}</div>
      <div class="bar ${det ? '' : 'ind'}"><div style="${det ? `width:${j.pct || 0}%` : ''}"></div></div>
      ${j.preview ? `<div class="preview">${esc(j.preview)}</div>` : ''}
      <div class="small-t muted" style="margin-top:8px">Tieni l'app aperta finché non finisce (può volerci qualche minuto).</div></div>`;
    return;
  }
  L = L || await DB.get('lectures', id);
  let html = L.error ? `<div class="note err small-t">⚠️ ${esc(L.error)}</div>` : '';
  if (!L.transcript) html += `<button class="btn block" id="goBtn" style="padding:16px">✨ Avvia trascrizione e riassunto</button>
    <p class="small-t muted">L'audio viene inviato a Google Gemini: prima la trascrizione completa, poi il riassunto con approfondimenti da fonti scientifiche.</p>`;
  else if (!L.summary) html += `<button class="btn block" id="goBtn">✨ Crea riassunto</button>`;
  box.innerHTML = html;
  $('#goBtn')?.addEventListener('click', () => processLecture(id));
}
function renderContent(L) {
  const box = $('#content'); if (!box || !L.transcript) { if (box) box.innerHTML = ''; return; }
  const tab = cur.tab;
  let body = '';
  if (tab === 'sum') {
    body = L.summary ? `
      <div class="legend">
        <span>Testo normale: <b>dalla lezione</b></span>
        <span><span class="web">Testo in questo carattere: aggiunte dell'IA da fonti web</span></span>
      </div>
      <div class="doc">${renderMd(L.summary)}</div>
      ${L.sources?.length ? `<h2 class="sec">Fonti consultate</h2><ol class="sources">${L.sources.map(s =>
        `<li><a href="${esc(s.uri)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join('')}</ol>` : ''}
      <div class="row"><button class="btn ghost small" id="shDoc">Condividi documento</button><button class="btn ghost small" id="cpSum">Copia testo</button>
        <button class="btn ghost small" id="reSum">Rigenera riassunto</button></div>`
      : `<p class="muted">Il riassunto non è ancora stato creato.</p>`;
  } else {
    body = `${L.truncated ? '<div class="note warn small-t">⚠️ La lezione è molto lunga: la trascrizione potrebbe essere incompleta alla fine.</div>' : ''}
      <div class="doc">${renderMd(L.transcript)}</div>
      <div class="row"><button class="btn ghost small" id="cpTr">Copia trascrizione</button><button class="btn ghost small" id="reTr">Rifai trascrizione</button></div>`;
  }
  box.innerHTML = `<div class="seg"><button data-t="sum" class="${tab === 'sum' ? 'on' : ''}">Riassunto</button><button data-t="tr" class="${tab === 'tr' ? 'on' : ''}">Trascrizione</button></div>${body}`;
  box.querySelectorAll('.seg button').forEach(b => b.onclick = () => { cur.tab = b.dataset.t; renderContent(L); });
  const busy = () => JOBS[L.id] && (toast('Elaborazione già in corso'), true);
  $('#reSum')?.addEventListener('click', () => { if (!busy() && confirm('Rigenerare il riassunto? Quello attuale verrà sostituito.')) processLecture(L.id); });
  $('#reTr')?.addEventListener('click', () => { if (!busy() && confirm('Rifare la trascrizione e il riassunto da capo?')) processLecture(L.id, {retranscribe: true}); });
  $('#cpSum')?.addEventListener('click', () => copy(`${L.title}\n\n${plainText(L.summary)}\n\n[🔎 …] = aggiunte dell'IA da fonti web`));
  $('#cpTr')?.addEventListener('click', () => copy(L.transcript));
  $('#shDoc')?.addEventListener('click', () => shareFile(new Blob([exportHtml(L)], {type: 'text/html'}), safeName(L.title) + '.html', L.title));
}
async function copy(t) { try { await navigator.clipboard.writeText(t); toast('Copiato ✓'); } catch { toast('Copia non riuscita'); } }
const safeName = s => (s || 'lezione').replace(/[\\/:*?"<>|]+/g, ' ').trim().slice(0, 80) || 'lezione';
const extFor = b => /webm/.test(b.type) ? 'webm' : /ogg/.test(b.type) ? 'ogg' : /mpeg|mp3/.test(b.type) ? 'mp3' : /wav/.test(b.type) ? 'wav' : 'm4a';
async function shareFile(blob, name, title) {
  const f = new File([blob], name, {type: blob.type || 'application/octet-stream'});
  if (navigator.canShare?.({files: [f]})) {
    try { await navigator.share({files: [f], title}); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const u = URL.createObjectURL(f), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 10000);
}
function exportHtml(L) {
  return `<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(L.title)}</title><style>
body{max-width:760px;margin:0 auto;padding:24px 16px;font:17px/1.6 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1c1c1e;background:#fff}
h1{font-size:24px;line-height:1.25}h2{font-size:19px;margin-top:28px;border-bottom:1px solid #ddd;padding-bottom:4px}
li{margin:6px 0}.ts{font:600 12px Menlo,monospace;color:#2f5bd3;background:#e8eefc;padding:1px 5px;border-radius:5px;margin-right:6px}
.web{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-style:italic;color:#0b6b63;background:#e3f3f0;border-radius:4px;padding:0 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.legend{font-size:14px;border:1px solid #ddd;border-radius:10px;padding:10px 12px}.meta{color:#666;font-size:14px}a{color:#2f5bd3;overflow-wrap:anywhere}
</style></head><body>
<div class="meta">${esc(L.title)} · ${fmtDate(L.createdAt)}</div>
<p class="legend">Testo normale: dalla lezione · <span class="web">testo in questo carattere: aggiunte dell'IA da fonti web</span></p>
${renderMd(L.summary)}
${L.sources?.length ? `<h2>Fonti consultate</h2><ol>${L.sources.map(s => `<li><a href="${esc(s.uri)}">${esc(s.title)}</a></li>`).join('')}</ol>` : ''}
<h2>Trascrizione completa</h2>${renderMd(L.transcript)}
</body></html>`;
}

async function viewSettings() {
  cur = {view: 'settings'};
  setHeader('Impostazioni', () => go('#/'), null); setDock('');
  main.innerHTML = `
    <h2 class="sec" style="margin-top:4px">Chiave API di Google Gemini</h2>
    <ol class="small-t" style="padding-left:20px">
      <li>Apri <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a> e accedi con il tuo account Google.</li>
      <li>Tocca <b>Create API key</b> (o "Crea chiave API").</li>
      <li>Copia la chiave e incollala qui sotto.</li>
    </ol>
    <input id="kIn" type="password" placeholder="Incolla qui la chiave (inizia con AIza…)" value="${esc(S.key)}" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="row"><button class="btn" id="kSave">Salva e verifica</button><button class="btn ghost" id="kShow">Mostra</button></div>
    <div id="kRes"></div>
    <h2 class="sec">Modelli AI</h2>
    <p class="small-t muted">Lascia <b>${DEFAULT_MODEL}</b> se non sai cosa scegliere: punta sempre al modello Flash più recente. Un modello "pro" è più accurato ma ha limiti gratuiti molto più bassi.</p>
    <label class="f" for="mTr">Trascrizione</label>
    <input id="mTr" list="mList" value="${esc(S.mTr)}" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label class="f" for="mSum">Riassunto e ricerca web</label>
    <input id="mSum" list="mList" value="${esc(S.mSum)}" autocomplete="off" autocapitalize="off" spellcheck="false">
    <datalist id="mList"></datalist>
    <h2 class="sec">Spazio sul telefono</h2>
    <p class="small-t" id="stor">…</p>
    <h2 class="sec">Privacy</h2>
    <p class="small-t muted">Le registrazioni restano solo su questo telefono. Per trascrivere e riassumere, l'audio e il testo vengono inviati a Google Gemini e il file caricato viene cancellato subito dopo. Con il piano gratuito Google può usare i dati inviati per migliorare i propri servizi. La chiave è salvata solo su questo dispositivo.</p>`;
  const save = () => { S.mTr = $('#mTr').value; S.mSum = $('#mSum').value; };
  $('#mTr').onchange = save; $('#mSum').onchange = save;
  $('#kShow').onclick = () => { const i = $('#kIn'); i.type = i.type === 'password' ? 'text' : 'password'; $('#kShow').textContent = i.type === 'password' ? 'Mostra' : 'Nascondi'; };
  $('#kSave').onclick = async () => {
    S.key = $('#kIn').value; save();
    const out = $('#kRes');
    if (!S.key) { out.innerHTML = '<div class="note warn small-t">Nessuna chiave inserita.</div>'; return; }
    out.innerHTML = '<div class="note small-t">Verifica in corso…</div>';
    try {
      const r = await fetch(`${API}/v1beta/models?pageSize=1000`, {headers: keyHeaders()});
      if (!r.ok) throw await apiError(r);
      const names = ((await r.json()).models || [])
        .filter(m => (m.supportedGenerationMethods || []).includes('generateContent') && /gemini/.test(m.name))
        .map(m => m.name.replace(/^models\//, ''));
      $('#mList').innerHTML = names.map(n => `<option value="${esc(n)}">`).join('');
      const miss = [S.mTr, S.mSum].filter(m => names.length && !names.includes(m));
      out.innerHTML = `<div class="note small-t" style="color:var(--ok)">✓ Chiave valida e salvata.</div>` +
        (miss.length ? `<div class="note warn small-t">Il modello "${esc(miss[0])}" non compare nell'elenco dei modelli disponibili: toccando il campo puoi sceglierne un altro.</div>` : '');
    } catch (e) { out.innerHTML = `<div class="note err small-t">${esc(e.message)}</div>`; }
  };
  try {
    const e = await navigator.storage?.estimate?.();
    const ls = await DB.all('lectures');
    $('#stor').textContent = `${ls.length} lezioni salvate` + (e ? ` · ${fmtSize(e.usage) || '0 MB'} usati` : '') +
      (navigator.standalone || matchMedia('(display-mode: standalone)').matches ? '' : '. Installa l\'app sulla schermata Home perché iOS non cancelli i dati.');
  } catch {}
}

  try { await recoverOrphans(); } catch (e) { console.error(e); }
  route();
